<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Scraping Detik</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .row-berita {
            display: grid;
            grid-template-columns: 50px 220px 1fr;
            border: 2px solid white;
            margin-bottom: 6px;
            min-height: 120px;
            align-items: center;
        }

        .row-berita.merah {
            background-color: red;
        }

        .row-berita.hijau {
            background-color: #00ff00;
        }

        .no {
            font-weight: bold;
            text-align: center;
            border-right: 2px solid white;
        }

        .gambar img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .judul {
            padding: 10px;
        }

        .judul a {
            color: blue;
            font-weight: bold;
            text-decoration: underline;
        }
    .berita-card {
        display: flex;
        gap: 15px;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .berita-card.merah {
        background-color: #dc3545;
    }

    .berita-card.hijau {
        background-color: #28a745;
    }

    .berita-img {
        width: 220px;
    }

    .berita-img img {
        width: 100%;
        height: 140px;
        object-fit: cover;
    }

    .berita-body {
        padding: 15px;
        color: white;
    }

    .berita-body a {
        color: #fff;
        font-weight: bold;
        text-decoration: underline;
    }

    .berita-body .tanggal {
        font-size: 13px;
        opacity: 0.9;
    }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Scraping</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/detik-populer">Detik Populer</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

   <div class="container mt-4">

    {% if not data %}
    <div class="d-flex justify-content-center align-items-center" style="height: 60vh;">
        <h1 class="fw-bold text-center">
            Berita Detik Populer
        </h1>
    </div>
    {% endif %}

    {% for d in data %}
    <div class="berita-card {{ d.color }}">

        <div class="berita-img">
            <img src="{{ d.img }}">
        </div>

        <div class="berita-body">
            <a href="{{ d.link }}" target="_blank">{{ d.title }}</a>
            <div class="tanggal mt-2">{{ d.date }}</div>
        </div>

    </div>
    {% endfor %}

</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
